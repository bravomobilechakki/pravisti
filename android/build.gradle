buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    if (project.name != 'app' && project != rootProject) {
        layout.buildDirectory.set(new File("/tmp/pravisti-android-build", project.name))
    }

    tasks.configureEach { task ->
        task.doFirst {
            try {
                def bDir = layout.buildDirectory.get().asFile
                if (bDir != null && bDir.exists()) {
                    bDir.eachFileRecurse { f ->
                        if (f.name.startsWith("._")) {
                            f.delete()
                        }
                    }
                }
            } catch (Exception e) {
                // Ignore if buildDir doesn't exist yet
            }
        }
    }
}








